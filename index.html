<script>
async function answerDate(answer) {

    const buttons = document.querySelectorAll("#answerButtons button");
    const message = document.getElementById("answerMessage");

    buttons.forEach(btn => btn.disabled = true);

    const textAnswer =
        answer === "yes"
            ? "Ja"
            : "Nein";

    try {

        const response = await fetch("https://formspree.io/f/mrpgyqdp", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                antwort: textAnswer,
                zeit: new Date().toLocaleString("de-DE"),
                frage: "Hast du heute Abend Lust auf ein Date mit mir?"
            })
        });

        if (!response.ok) {
            throw new Error("Antwort konnte nicht gesendet werden");
        }

        document.getElementById("answerButtons").style.display = "none";

        if (answer === "yes") {

            message.innerHTML =
                "YAAAAAY <br>" +
                "Dann mach dich heute Abend bereit... 👀✨";

            heartExplosion();

            setTimeout(() => {
                document.getElementById("datePopup").style.display = "none";
            }, 4500);

        } else {

            message.innerHTML =
                "Wie hast du den Button überhaupt erwischt?! 😭😂<br>" +
                "Okayyy ";

            setTimeout(() => {
                document.getElementById("datePopup").style.display = "none";
            }, 4000);
        }

    } catch (error) {

        message.innerHTML =
            "Ups 🥲<br>Da ist etwas schiefgelaufen.";

        buttons.forEach(btn => btn.disabled = false);
    }
}
</script>


<!DOCTYPE html>

<style>

/* =========================================================
   GRUNDLAYOUT
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    font-family: 'Segoe UI', sans-serif;

    background: linear-gradient(

        #ffdde1

    text-align: center;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

nav {

    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 9999;
}

.dropdown {
    position: relative;
}

.dropdown button {

    border: none;

    padding: 15px 25px;

    border-radius: 20px;

    cursor: pointer;

    font-size: 16px;
    font-weight: bold;

    background: rgba(255,255,255,0.2);

    backdrop-filter: blur(15px);

    color: white;

    box-shadow:

    transition: 0.3s;
}

.dropdown button:hover {

    transform: translateY(-3px);

    background: rgba(255,255,255,.3);
}

.dropdown-content {

    position: absolute;

    top: 60px;
    left: 0;

    display: none;

    min-width: 220px;

    background: rgba(255,255,255,0.2);

    backdrop-filter: blur(20px);

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.2);
}

.dropdown-content a {

    display: block;

    padding: 15px;

    color: white;

    text-decoration: none;

    font-weight: bold;
}

.dropdown-content a:hover {

    background: rgba(255,255,255,0.15);
}

.dropdown:hover .dropdown-content {

    display: block;
}


/* =========================================================
   TITEL
   ========================================================= */

h1 {

    color: white;

    font-size: 55px;

    max-width: 1100px;

    margin-bottom: 50px;

    text-shadow:
        0 5px 20px rgba(0,0,0,0.25);

    animation: floatText 3s ease-in-out infinite;
}

@keyframes floatText {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}


/* =========================================================
   BILDER
   ========================================================= */

.images {

    display: flex;

    gap: 60px;

    flex-wrap: wrap;

    justify-content: center;
}

.images img {

    width: 320px;
    height: 420px;

    object-fit: cover;

    border-radius: 35px;

    border: 4px solid rgba(255,255,255,0.4);

    box-shadow:
        0 20px 40px rgba(0,0,0,0.25);

    animation:
        spin 10s linear infinite,
        float 4s ease-in-out infinite;

    transition: .4s;
}

.images img:hover {

    animation-play-state: paused;

    transform: scale(1.1);
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes float {

    0%,100% {
        translate: 0 0;
    }

    50% {
        translate: 0 -20px;
    }
}


/* =========================================================
   HINTERGRUND-HERZEN
   ========================================================= */

.heart {

    position: absolute;

    color: white;

    opacity: .3;

    animation: hearts 10s linear infinite;

    pointer-events: none;
}

@keyframes hearts {

    from {
        transform: translateY(100vh);
    }

    to {
        transform: translateY(-120vh);
    }
}


/* =========================================================
   DATE POPUP
   ========================================================= */

.popup-overlay {

    position: fixed;

    inset: 0;

    background: rgba(30,10,20,.60);

    backdrop-filter: blur(15px);

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 99999;

    animation: fadeIn .6s ease;
}

.date-popup {

    position: relative;

    width: min(90%, 520px);

    padding: 45px 40px;

    background: rgba(255,255,255,.20);

    border:
        1px solid rgba(255,255,255,.45);

    backdrop-filter: blur(30px);

    border-radius: 35px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.5);

    color: white;

    animation:
        popupIn .8s cubic-bezier(.16,1,.3,1);
}


/* Herz oben */

.popup-heart {

    font-size: 70px;

    margin-bottom: 15px;

    animation: heartbeat 1.4s infinite;
}


/* Popup Titel */

.date-popup h2 {

    font-size: 34px;

    margin-bottom: 20px;
}


/* Frage */

.question {

    font-size: 23px;

    font-weight: 600;

    line-height: 1.4;
}


/* kleiner Text */

.hint {

    margin-top: 12px;

    opacity: .8;

    font-size: 16px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.answer-buttons {

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 25px;

    margin-top: 35px;

    min-height: 70px;
}

.answer-buttons button {

    padding: 16px 35px;

    border: none;

    border-radius: 50px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(0,0,0,.15);

    transition:
        transform .25s,
        box-shadow .25s;
}


/* JA */

.yes {

    background: white;

    color: #e85d7f;

    z-index: 2;
}

.yes:hover {

    transform: scale(1.15);

    box-shadow:
        0 15px 35px rgba(255,255,255,.35);
}


/* NEIN */

.no {

    background: rgba(255,255,255,.15);

    color: white;

    border:
        1px solid rgba(255,255,255,.4) !important;

    z-index: 100001;
}


/* Info */

.answer-info {

    margin-top: 20px;

    font-size: 11px;

    opacity: .5;
}


/* Antwort */

#answerMessage {

    margin-top: 25px;

    font-size: 20px;

    font-weight: 600;

    line-height: 1.5;
}


/* =========================================================
   ANIMATIONEN
   ========================================================= */

@keyframes popupIn {

    from {

        opacity: 0;

        transform:
            translateY(50px)
            scale(.75);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}


/* =========================================================
   HANDY
   ========================================================= */

@media(max-width: 600px) {

    h1 {

        font-size: 30px;

        padding: 0 20px;
    }

    .images {

        gap: 20px;
    }

    .images img {

        width: 180px;

        height: 240px;
    }

    .date-popup {

        padding: 35px 20px;
    }

    .date-popup h2 {

        font-size: 28px;
    }

    .question {

        font-size: 20px;
    }

}

</style>

</head>


<body>

<script>

/* =========================================================
   NEIN BUTTON FLÜCHTET 😂
   ========================================================= */

function runAway(event) {

    if (event) {
        event.preventDefault();
    }

    const button =
        document.getElementById("noButton");


    /*
       Beim ersten Fluchtversuch wird der Button
       aus dem normalen Layout genommen.
    */

    button.style.position = "fixed";


    /*
       Sicherheitsabstand vom Bildschirmrand
    */

    const padding = 20;

    const maxX =
        window.innerWidth -
        button.offsetWidth -
        padding;

    const maxY =
        window.innerHeight -
        button.offsetHeight -
        padding;


    const x =
        Math.max(
            padding,
            Math.random() * maxX
        );

    const y =
        Math.max(
            padding,
            Math.random() * maxY
        );


    button.style.left = x + "px";
    button.style.top = y + "px";

}



/* =========================================================
   ANTWORT ABSCHICKEN
   ========================================================= */

async function answerDate(answer) {

    const buttons =
        document.querySelectorAll(
            "#answerButtons button"
        );

    const message =
        document.getElementById(
            "answerMessage"
        );


    buttons.forEach(btn => {

        btn.disabled = true;

    });


    const data =
        new FormData();

    data.append(
        "answer",
        answer
    );


    try {

        const response =
            await fetch(
                window.location.href,
                {
                    method: "POST",
                    body: data
                }
            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                "E-Mail konnte nicht gesendet werden."
            );

        }


        /*
           Buttons verschwinden
        */

        document.getElementById(
            "answerButtons"
        ).style.display = "none";


        /* ==========================
           JA
           ========================== */

        if (answer === "yes") {

            message.innerHTML =

                "YAAAAAY 🥹❤️<br>" +

                "Dann mach dich heute Abend bereit... 👀✨";


            heartExplosion();


            setTimeout(() => {

                document.getElementById(
                    "datePopup"
                ).style.display = "none";

            }, 4500);

        }


        /* ==========================
           NEIN
           ========================== */

        else {

            message.innerHTML =

                "Wie hast du den Button überhaupt erwischt?! 😭😂<br>" +

                "Okayyy 🥺❤️";


            setTimeout(() => {

                document.getElementById(
                    "datePopup"
                ).style.display = "none";

            }, 4000);

        }

    }

    catch(error) {

        message.innerHTML =

            "Ups 🥲<br>" +

            "Da ist etwas schiefgelaufen.";


        buttons.forEach(btn => {

            btn.disabled = false;

        });

    }

}



/* =========================================================
   HERZ EXPLOSION BEI JA
   ========================================================= */

function heartExplosion() {

    for(let i = 0; i < 50; i++) {

        const heart =
            document.createElement("div");


        heart.innerHTML =
            Math.random() > .3
                ? "❤️"
                : "💗";


        heart.style.position =
            "fixed";

        heart.style.left =
            "50vw";

        heart.style.top =
            "50vh";

        heart.style.fontSize =
            (15 + Math.random() * 30)
            + "px";

        heart.style.zIndex =
            "100000";

        heart.style.pointerEvents =
            "none";


        heart.style.transition =

            "all " +

            (1.5 + Math.random() * 2)

            + "s ease-out";


        document.body.appendChild(
            heart
        );


        const x =

            (Math.random() - .5)

            * window.innerWidth;


        const y =

            (Math.random() - .5)

            * window.innerHeight;


        setTimeout(() => {

            heart.style.transform =

                `translate(${x}px, ${y}px)
                 rotate(${Math.random()*720}deg)
                 scale(${Math.random()+.5})`;


            heart.style.opacity =
                "0";

        }, 30);


        setTimeout(() => {

            heart.remove();

        }, 3500);

    }

}

</script>
